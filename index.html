<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data cube | UKCEH</title>
  <meta name="description" content="Decoding nature reveals its stories. An interactive data cube animation from UKCEH.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app is-intro">
    <main class="stage">
      <div id="canvas-wrap" class="canvas-wrap" role="img" aria-label=""></div>
      <div id="hero" class="hero" aria-hidden="true">
        <h1 id="hero-title"></h1>
        <p id="hero-text"></p>
      </div>
      <p id="status" class="status" role="alert" hidden></p>
    </main>

    <footer class="caption">
      <div class="caption-row">
        <div class="caption-main">
          <div class="caption-body" aria-live="polite" aria-atomic="true">
            <h2 id="caption-title"></h2>
            <p id="insight-indicator" class="insight-indicator" aria-hidden="true" hidden></p>
            <p id="caption-text"></p>
            <p id="caption-summary" class="visually-hidden"></p>
          </div>
          <p id="note" class="note is-hidden"></p>
        </div>
        <div class="caption-controls">
          <ol id="progress" class="progress" aria-hidden="true"></ol>
          <p id="progress-label" class="visually-hidden"></p>
          <div class="buttons">
            <button id="back" type="button" aria-disabled="true">Back</button>
            <button id="next" type="button" class="primary">Next</button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <noscript><p class="noscript">This animation needs JavaScript.</p></noscript>
  <script src="data/data-cube.js"></script>
  <script src="dist/app.js"></script>
</body>
</html>
